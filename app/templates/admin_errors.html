<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Errors — ORCHESTRAVEL Beta Control Center</title>
<style>
* { box-sizing: border-box; }
:root {
    --sidebar-grad: linear-gradient(180deg, #0a0f1c 0%, #121b30 60%, #16213a 100%);
    --teal: #17b3a3; --teal-soft: rgba(23,179,163,.12);
    --amber: #b4762b; --amber-soft: rgba(180,118,43,.12);
    --danger: #c94b4b; --danger-soft: rgba(201,75,75,.1);
    --ok: #1f9d55; --ok-soft: rgba(31,157,85,.1);
    --bg: #f4f6fa; --card: #ffffff; --border: #e3e7ee; --text: #16202f; --text-muted: #66728a;
    --sidebar-text: #c4cede; --sidebar-text-dim: #8792ac;
}
html, body { margin: 0; min-height: 100%; font-family: 'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif; background: var(--bg); color: var(--text); }
.shell { display: flex; min-height: 100vh; }
.sidebar { flex: 0 0 220px; background: var(--sidebar-grad); color: var(--sidebar-text); padding: 20px 14px; }
.sidebar .brand { font-size: 14px; font-weight: 700; color: white; }
.sidebar .sub { font-size: 11.5px; color: var(--sidebar-text-dim); margin-bottom: 22px; }
.sidebar nav a { display: block; padding: 9px 10px; border-radius: 8px; color: var(--sidebar-text); text-decoration: none; font-size: 13.5px; margin-bottom: 2px; }
.sidebar nav a:hover { background: rgba(255,255,255,.06); color: white; }
.sidebar nav a.active { background: var(--teal-soft); color: white; font-weight: 600; }
.sidebar .back-to-cabinet {
    display: block;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,.08);
    color: var(--sidebar-text-dim);
    text-decoration: none;
    font-size: 12.5px;
}
.sidebar .back-to-cabinet:hover { color: white; }
.main { flex: 1; padding: 24px 28px; min-width: 0; }
h1 { font-size: 19px; margin: 0 0 14px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.filters select, .filters input { border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; font-family: inherit; }
.error-card { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--text-muted); border-radius: 10px; padding: 12px 16px; margin-bottom: 10px; }
.error-card.critical, .error-card.error { border-left-color: var(--danger); }
.error-card.warning { border-left-color: var(--amber); }
.error-card.info { border-left-color: var(--teal); }
.error-top { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 6px; }
.error-title { font-weight: 700; font-size: 13.5px; }
.error-count { font-size: 12.5px; color: var(--text-muted); }
.error-meta { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.badge { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
.badge.critical, .badge.error { background: var(--danger-soft); color: var(--danger); }
.badge.warning { background: var(--amber-soft); color: var(--amber); }
.badge.info { background: var(--teal-soft); color: var(--teal); }
.loading { color: var(--text-muted); font-size: 13px; }
@media (max-width: 820px) { .shell { flex-direction: column; } .sidebar { flex: none; display: flex; gap: 4px; overflow-x: auto; padding: 10px; } .sidebar .brand, .sidebar .sub { display: none; } .sidebar nav { display: flex; gap: 4px; } .sidebar .back-to-cabinet { margin: 0; padding: 9px 10px; border-top: none; white-space: nowrap; flex: 0 0 auto; } .main { padding: 16px; } }
</style>
</head>
<body>

<div class="shell">
    <aside class="sidebar">
        <div class="brand">ORCHESTRAVEL</div>
        <div class="sub">Beta Control Center</div>
        <nav id="adminNav"></nav>
        <a href="/" class="back-to-cabinet">&larr; Вернуться в кабинет</a>
    </aside>
    <main class="main">
        <h1>Ошибки</h1>
        <div class="filters">
            <select id="periodSelect">
                <option value="24h">24 часа</option>
                <option value="7d" selected>7 дней</option>
            </select>
            <input type="text" id="moduleFilter" placeholder="Модуль (например chat)">
            <select id="severityFilter">
                <option value="">Все уровни</option>
                <option value="critical">Critical</option>
                <option value="error">Error</option>
                <option value="warning">Warning</option>
                <option value="info">Info</option>
            </select>
            <input type="number" id="workspaceFilter" placeholder="Workspace ID">
            <button type="button" id="applyBtn">Применить</button>
        </div>
        <div id="results"><div class="loading">Загрузка…</div></div>
    </main>
</div>

<script>
const ADMIN_NAV_ITEMS = [
    ["/admin", "Обзор"], ["/admin/workspaces", "Пользователи / Workspaces"],
    ["/admin/billing", "Подписки / Оплаты"], ["/admin/errors", "Ошибки"],
    ["/admin/activity", "Активность"], ["/admin/feedback", "Feedback"],
    ["/admin/health", "Health"], ["/admin/audit-log", "Audit log"],
];
function renderAdminNav(containerId, currentPath) {
    const nav = document.createElement("nav");
    ADMIN_NAV_ITEMS.forEach(([href, label]) => {
        const a = document.createElement("a");
        a.href = href; a.textContent = label;
        if (href === currentPath) a.classList.add("active");
        nav.appendChild(a);
    });
    const container = document.getElementById(containerId);
    container.replaceWith(nav);
    nav.id = containerId;
}
renderAdminNav("adminNav", "/admin/errors");

async function load() {
    const results = document.getElementById("results");
    results.innerHTML = '<div class="loading">Загрузка…</div>';
    const params = new URLSearchParams({ period: document.getElementById("periodSelect").value });
    const module = document.getElementById("moduleFilter").value.trim();
    const severity = document.getElementById("severityFilter").value;
    const workspaceId = document.getElementById("workspaceFilter").value.trim();
    if (module) params.set("module", module);
    if (severity) params.set("severity", severity);
    if (workspaceId) params.set("workspace_id", workspaceId);

    try {
        const response = await fetch("/api/admin/errors?" + params.toString());
        if (response.status === 404) {
            document.body.innerHTML = "<p style='padding:40px;font-family:sans-serif;'>Not found.</p>";
            return;
        }
        const data = await response.json();
        const groups = data.groups || [];
        if (groups.length === 0) {
            results.innerHTML = '<div class="loading">За этот период ошибок нет.</div>';
            return;
        }
        results.innerHTML = "";
        groups.forEach(g => {
            const card = document.createElement("div");
            card.className = `error-card ${g.severity}`;
            card.innerHTML = `
                <div class="error-top">
                    <span class="error-title">${g.module} / ${g.event_type}${g.error_code ? " — " + g.error_code : ""}</span>
                    <span class="badge ${g.severity}">${g.severity}</span>
                </div>
                <div class="error-count">Повторилась ${g.occurrences} раз(а) у ${g.workspace_count} workspace</div>
                <div class="error-meta">
                    Последний раз: ${g.last_occurred_at.slice(0, 19).replace("T", " ")}
                    ${g.sample_request_id ? " · request_id: " + g.sample_request_id : ""}
                </div>
                ${g.sample_safe_message ? `<div class="error-meta">${g.sample_safe_message}</div>` : ""}
            `;
            results.appendChild(card);
        });
    } catch (_) {
        results.innerHTML = '<div class="loading">Ошибка загрузки.</div>';
    }
}

document.getElementById("applyBtn").addEventListener("click", load);
load();
</script>

</body>
</html>
