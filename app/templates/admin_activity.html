<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Activity — ORCHESTRAVEL Beta Control Center</title>
<style>
* { box-sizing: border-box; }
:root {
    --sidebar-grad: linear-gradient(180deg, #0a0f1c 0%, #121b30 60%, #16213a 100%);
    --teal: #17b3a3; --teal-dark: #0f9488; --teal-soft: rgba(23,179,163,.12);
    --bg: #f4f6fa; --card: #ffffff; --border: #e3e7ee; --text: #16202f; --text-muted: #66728a;
    --sidebar-text: #c4cede; --sidebar-text-dim: #8792ac;
}
html, body { margin: 0; min-height: 100%; font-family: 'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif; background: var(--bg); color: var(--text); }
.shell { display: flex; min-height: 100vh; }
.sidebar { flex: 0 0 220px; background: var(--sidebar-grad); color: var(--sidebar-text); padding: 20px 14px; }
.sidebar .brand { font-size: 14px; font-weight: 700; color: white; }
.sidebar .sub { font-size: 11.5px; color: var(--sidebar-text-dim); margin-bottom: 22px; }
.sidebar nav a { display: block; padding: 9px 10px; border-radius: 8px; color: var(--sidebar-text); text-decoration: none; font-size: 13.5px; margin-bottom: 2px; }
.sidebar nav a:hover { background: rgba(255,255,255,.06); color: white; }
.sidebar nav a.active { background: var(--teal-soft); color: white; font-weight: 600; }
.sidebar .back-to-cabinet {
    display: block;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,.08);
    color: var(--sidebar-text-dim);
    text-decoration: none;
    font-size: 12.5px;
}
.sidebar .back-to-cabinet:hover { color: white; }
.main { flex: 1; padding: 24px 28px; min-width: 0; max-width: 700px; }
h1 { font-size: 19px; margin: 0 0 6px; }
.note { font-size: 12.5px; color: var(--text-muted); margin-bottom: 20px; }
.funnel-row { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
.funnel-label { width: 190px; font-size: 13px; flex: 0 0 auto; }
.funnel-bar-wrap { flex: 1; background: var(--border); border-radius: 6px; height: 22px; overflow: hidden; }
.funnel-bar { background: linear-gradient(90deg, var(--teal) 0%, var(--teal-dark) 100%); height: 100%; border-radius: 6px; min-width: 2px; }
.funnel-count { width: 46px; text-align: right; font-weight: 700; font-size: 13.5px; }
.loading { color: var(--text-muted); font-size: 13px; }
@media (max-width: 820px) { .shell { flex-direction: column; } .sidebar { flex: none; display: flex; gap: 4px; overflow-x: auto; padding: 10px; } .sidebar .brand, .sidebar .sub { display: none; } .sidebar nav { display: flex; gap: 4px; } .sidebar .back-to-cabinet { margin: 0; padding: 9px 10px; border-top: none; white-space: nowrap; flex: 0 0 auto; } .main { padding: 16px; } .funnel-label { width: 130px; font-size: 12px; } }
</style>
</head>
<body>

<div class="shell">
    <aside class="sidebar">
        <div class="brand">ORCHESTRAVEL</div>
        <div class="sub">Beta Control Center</div>
        <nav id="adminNav"></nav>
        <a href="/" class="back-to-cabinet">&larr; Вернуться в кабинет</a>
    </aside>
    <main class="main">
        <h1>Активность (funnel)</h1>
        <div class="note" id="note"></div>
        <div id="funnel"><div class="loading">Загрузка…</div></div>
    </main>
</div>

<script>
const ADMIN_NAV_ITEMS = [
    ["/admin", "Обзор"], ["/admin/workspaces", "Пользователи / Workspaces"],
    ["/admin/billing", "Подписки / Оплаты"], ["/admin/errors", "Ошибки"],
    ["/admin/activity", "Активность"], ["/admin/feedback", "Feedback"],
    ["/admin/health", "Health"], ["/admin/audit-log", "Audit log"],
];
function renderAdminNav(containerId, currentPath) {
    const nav = document.createElement("nav");
    ADMIN_NAV_ITEMS.forEach(([href, label]) => {
        const a = document.createElement("a");
        a.href = href; a.textContent = label;
        if (href === currentPath) a.classList.add("active");
        nav.appendChild(a);
    });
    const container = document.getElementById(containerId);
    container.replaceWith(nav);
    nav.id = containerId;
}
renderAdminNav("adminNav", "/admin/activity");

const STEP_LABELS = {
    registered: "Зарегистрировались",
    onboarding_completed: "Прошли onboarding",
    first_chat: "Задали первый вопрос",
    first_competitor: "Добавили конкурента",
    first_attachment: "Загрузили файл",
    first_material_edit: "Отредактировали материал",
    return_visit: "Вернулись позже",
};

async function load() {
    try {
        const response = await fetch("/api/admin/activity");
        if (response.status === 404) {
            document.body.innerHTML = "<p style='padding:40px;font-family:sans-serif;'>Not found.</p>";
            return;
        }
        const data = await response.json();
        document.getElementById("note").textContent = data.note || "";
        const funnel = data.funnel || [];
        const max = Math.max(1, ...funnel.map(f => f.count));
        const container = document.getElementById("funnel");
        container.innerHTML = "";
        funnel.forEach(f => {
            const row = document.createElement("div");
            row.className = "funnel-row";
            const widthPct = Math.round((f.count / max) * 100);
            row.innerHTML = `
                <div class="funnel-label">${STEP_LABELS[f.step] || f.step}</div>
                <div class="funnel-bar-wrap"><div class="funnel-bar" style="width:${widthPct}%"></div></div>
                <div class="funnel-count">${f.count}</div>
            `;
            container.appendChild(row);
        });
    } catch (_) {
        document.getElementById("funnel").innerHTML = '<div class="loading">Ошибка загрузки.</div>';
    }
}

load();
</script>

</body>
</html>
