<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Регистрация — ORCHESTRAVEL</title>
<style>
* { box-sizing: border-box; }

:root {
    --navy-950: #0a0f1c;
    --navy-900: #0d1424;
    --sidebar-grad: linear-gradient(180deg, #0a0f1c 0%, #121b30 60%, #16213a 100%);
    --teal: #17b3a3;
    --teal-dark: #0f9488;
    --bg: #f4f6fa;
    --card: #ffffff;
    --border: #e3e7ee;
    --text: #16202f;
    --text-muted: #66728a;
    --danger: #c94b4b;
    --danger-soft: rgba(201, 75, 75, .1);
}

html, body {
    margin: 0;
    min-height: 100%;
    font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont,
        Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: var(--sidebar-grad);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
}

.auth-shell {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
}

.auth-card {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border-radius: 16px;
    padding: 32px 28px 28px;
    box-shadow: 0 20px 60px rgba(5, 10, 20, .35);
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
    margin-bottom: 26px;
}

.brand-mark {
    flex: 0 0 auto;
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--teal) 0%, #3fd1c4 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 16px rgba(23, 179, 163, .35);
}

.brand-mark svg { width: 18px; height: 18px; }

.brand-text .name {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.25;
}

.brand-text .sub {
    font-size: 12px;
    color: var(--text-muted);
}

h1 { font-size: 20px; margin: 0 0 4px; }

.auth-sub {
    font-size: 13.5px;
    color: var(--text-muted);
    margin: 0 0 22px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 14px;
}

.field label {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-muted);
}

.field input {
    display: block;
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    padding: 10px 12px;
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    font-family: inherit;
}

.field input:focus {
    outline: none;
    border-color: var(--teal);
}

.field-hint {
    font-size: 11.5px;
    color: var(--text-muted);
}

.submit-btn {
    width: 100%;
    border: 0;
    background: linear-gradient(135deg, var(--teal) 0%, var(--teal-dark) 100%);
    color: white;
    border-radius: 10px;
    padding: 11px 16px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 6px;
    box-shadow: 0 4px 14px rgba(15, 148, 136, .28);
    transition: filter .15s ease, transform .1s ease;
}

.submit-btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
.submit-btn:disabled { opacity: .6; cursor: wait; filter: none; transform: none; }

.error-box {
    display: none;
    background: var(--danger-soft);
    color: var(--danger);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    margin-bottom: 14px;
}

.error-box.show { display: block; }

.login-hint {
    margin-top: 20px;
    font-size: 12.5px;
    color: var(--text-muted);
    text-align: center;
}

.login-hint a { color: var(--teal-dark); font-weight: 600; text-decoration: none; }
.login-hint a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="auth-shell">
    <div class="auth-card">
        <div class="brand">
            <div class="brand-mark">
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2l2.6 6.6L21 11l-6.4 2.4L12 20l-2.6-6.6L3 11l6.4-2.4z"/>
                </svg>
            </div>
            <div class="brand-text">
                <div class="name">ORCHESTRAVEL</div>
                <div class="sub">Регистрация нового рабочего пространства</div>
            </div>
        </div>

        <h1>Создать аккаунт</h1>
        <p class="auth-sub">Займёт меньше минуты. Дальше — выбор тарифа.</p>

        <div class="error-box" id="errorBox"></div>

        <form id="signupForm" novalidate>
            <div class="field">
                <label for="name">Имя</label>
                <input type="text" id="name" name="name" autocomplete="name" required>
            </div>
            <div class="field">
                <label for="businessName">Название бизнеса</label>
                <input type="text" id="businessName" name="businessName" autocomplete="organization" required>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>
            <div class="field">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" autocomplete="new-password" required>
                <div class="field-hint">Не короче 10 символов.</div>
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">Зарегистрироваться</button>
        </form>

        <p class="login-hint">Уже есть аккаунт? <a href="/login">Войти</a></p>
    </div>
</div>

<script>
const form = document.getElementById("signupForm");
const submitBtn = document.getElementById("submitBtn");
const errorBox = document.getElementById("errorBox");

function showError(text) {
    errorBox.textContent = text;
    errorBox.classList.add("show");
}

function hideError() {
    errorBox.classList.remove("show");
    errorBox.textContent = "";
}

form.addEventListener("submit", async (event) => {
    event.preventDefault();
    hideError();
    submitBtn.disabled = true;

    try {
        const response = await fetch("/api/auth/signup", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                name: document.getElementById("name").value,
                business_name: document.getElementById("businessName").value,
                email: document.getElementById("email").value,
                password: document.getElementById("password").value,
            }),
        });

        const data = await response.json();

        if (!response.ok || data.error) {
            showError(data.error || "Не удалось завершить регистрацию. Попробуйте ещё раз.");
            return;
        }

        window.location.href = "/billing";

    } catch (_) {
        showError("Ошибка соединения. Попробуйте ещё раз.");
    } finally {
        submitBtn.disabled = false;
    }
});
</script>

</body>
</html>
