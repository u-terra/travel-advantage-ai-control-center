<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workspace — ORCHESTRAVEL Beta Control Center</title>
<style>
* { box-sizing: border-box; }
:root {
    --sidebar-grad: linear-gradient(180deg, #0a0f1c 0%, #121b30 60%, #16213a 100%);
    --teal: #17b3a3; --teal-dark: #0f9488; --teal-soft: rgba(23,179,163,.12);
    --amber: #b4762b; --amber-soft: rgba(180,118,43,.12);
    --danger: #c94b4b; --danger-soft: rgba(201,75,75,.1);
    --ok: #1f9d55; --ok-soft: rgba(31,157,85,.1);
    --bg: #f4f6fa; --card: #ffffff; --border: #e3e7ee; --text: #16202f; --text-muted: #66728a;
    --sidebar-text: #c4cede; --sidebar-text-dim: #8792ac;
}
html, body { margin: 0; min-height: 100%; font-family: 'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif; background: var(--bg); color: var(--text); }
.shell { display: flex; min-height: 100vh; }
.sidebar { flex: 0 0 220px; background: var(--sidebar-grad); color: var(--sidebar-text); padding: 20px 14px; }
.sidebar .brand { font-size: 14px; font-weight: 700; color: white; }
.sidebar .sub { font-size: 11.5px; color: var(--sidebar-text-dim); margin-bottom: 22px; }
.sidebar nav a { display: block; padding: 9px 10px; border-radius: 8px; color: var(--sidebar-text); text-decoration: none; font-size: 13.5px; margin-bottom: 2px; }
.sidebar nav a:hover { background: rgba(255,255,255,.06); color: white; }
.sidebar nav a.active { background: var(--teal-soft); color: white; font-weight: 600; }
.sidebar .back-to-cabinet {
    display: block;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,.08);
    color: var(--sidebar-text-dim);
    text-decoration: none;
    font-size: 12.5px;
}
.sidebar .back-to-cabinet:hover { color: white; }
.main { flex: 1; padding: 24px 28px; min-width: 0; max-width: 1000px; }
.back-link { font-size: 12.5px; color: var(--text-muted); text-decoration: none; }
h1 { font-size: 19px; margin: 6px 0 18px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 18px; }
.card h2 { font-size: 13.5px; margin: 0 0 12px; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px 20px; font-size: 13px; }
.kv .k { color: var(--text-muted); font-size: 11.5px; text-transform: uppercase; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--border); }
th { color: var(--text-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; }
.badge { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 11.5px; font-weight: 600; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--amber-soft); color: var(--amber); }
.badge.danger { background: var(--danger-soft); color: var(--danger); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--border); background: var(--card); border-radius: 8px; padding: 7px 12px; font-size: 12.5px; cursor: pointer; }
.btn-primary { background: var(--teal); border-color: var(--teal); color: white; }
.btn-danger { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
.action-msg { font-size: 12px; margin-top: 8px; color: var(--text-muted); }
.loading { color: var(--text-muted); font-size: 13px; }
@media (max-width: 820px) { .shell { flex-direction: column; } .sidebar { flex: none; display: flex; gap: 4px; overflow-x: auto; padding: 10px; } .sidebar .brand, .sidebar .sub { display: none; } .sidebar nav { display: flex; gap: 4px; } .sidebar .back-to-cabinet { margin: 0; padding: 9px 10px; border-top: none; white-space: nowrap; flex: 0 0 auto; } .main { padding: 16px; } }
</style>
</head>
<body>

<div class="shell">
    <aside class="sidebar">
        <div class="brand">ORCHESTRAVEL</div>
        <div class="sub">Beta Control Center</div>
        <nav id="adminNav"></nav>
        <a href="/" class="back-to-cabinet">&larr; Вернуться в кабинет</a>
    </aside>
    <main class="main">
        <a class="back-link" href="/admin/workspaces">← Пользователи / Workspaces</a>
        <h1 id="pageTitle">Workspace</h1>
        <div id="content"><div class="loading">Загрузка…</div></div>
    </main>
</div>

<script>
const ADMIN_NAV_ITEMS = [
    ["/admin", "Обзор"], ["/admin/workspaces", "Пользователи / Workspaces"],
    ["/admin/billing", "Подписки / Оплаты"], ["/admin/errors", "Ошибки"],
    ["/admin/activity", "Активность"], ["/admin/feedback", "Feedback"],
    ["/admin/health", "Health"], ["/admin/audit-log", "Audit log"],
];
function renderAdminNav(containerId, currentPath) {
    const nav = document.createElement("nav");
    ADMIN_NAV_ITEMS.forEach(([href, label]) => {
        const a = document.createElement("a");
        a.href = href; a.textContent = label;
        if (href === currentPath) a.classList.add("active");
        nav.appendChild(a);
    });
    const container = document.getElementById(containerId);
    container.replaceWith(nav);
    nav.id = containerId;
}
renderAdminNav("adminNav", "/admin/workspaces");

function csrfToken() {
    return document.cookie.split("; ").find((row) => row.startsWith("ta_csrf="))?.split("=")[1] || "";
}

const workspaceId = window.location.pathname.split("/").filter(Boolean).pop();
const SUB_BADGE_CLASS = { active: "ok", trial: "ok", beta: "ok", past_due: "warn", expired: "warn", suspended: "danger" };
function fmtDate(raw) { return raw ? raw.slice(0, 10) : "—"; }
function badge(status) {
    if (!status) return "—";
    return `<span class="badge ${SUB_BADGE_CLASS[status] || ""}">${status}</span>`;
}

async function callAction(path, body) {
    const response = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-CSRF-Token": csrfToken() },
        body: JSON.stringify(body),
    });
    return response.json();
}

function renderContent(data) {
    const w = data.workspace;
    document.getElementById("pageTitle").textContent = w.name;

    const membersRows = data.members.map(m => `
        <tr><td>${m.telegram_user_id}</td><td>${m.role}</td><td>${m.status}</td>
        <td>${m.email || "—"}</td><td>${m.onboarding_completed === true ? "да" : (m.onboarding_completed === false ? "нет" : "—")}</td></tr>
    `).join("") || '<tr><td colspan="5" class="loading">Нет участников.</td></tr>';

    const ordersRows = data.payment_orders.map(o => `
        <tr><td>${o.id}</td><td>${o.plan}</td><td>${o.amount} ${o.currency}</td>
        <td>${o.provider}</td><td>${badge(o.status === "paid" ? "active" : "expired")} ${o.status}</td>
        <td>${fmtDate(o.created_at)}</td><td>${fmtDate(o.paid_at)}</td></tr>
    `).join("") || '<tr><td colspan="7" class="loading">Платежей нет.</td></tr>';

    const eventsRows = data.recent_events.map(e => `
        <tr><td>${e.occurred_at.slice(0, 19).replace("T", " ")}</td><td>${e.module}</td><td>${e.event_type}</td>
        <td>${e.success ? "✅" : "❌"}</td><td>${e.severity}</td><td>${e.latency_ms ?? "—"}</td>
        <td>${e.safe_message || e.error_code || "—"}</td></tr>
    `).join("") || '<tr><td colspan="7" class="loading">Событий пока нет.</td></tr>';

    const sub = data.subscription;

    document.getElementById("content").innerHTML = `
        <div class="card">
            <h2>Workspace</h2>
            <div class="kv">
                <div><div class="k">Название</div>${w.name}</div>
                <div><div class="k">Slug</div>${w.slug}</div>
                <div><div class="k">Business name</div>${w.business_name || "—"}</div>
                <div><div class="k">TA affiliated</div>${w.ta_affiliated ? "да" : "нет"}</div>
                <div><div class="k">Создан</div>${fmtDate(w.created_at)}</div>
                <div><div class="k">Статус workspace</div>${w.status}</div>
            </div>
        </div>

        <div class="card">
            <h2>Подписка</h2>
            <div class="kv">
                <div><div class="k">Статус</div>${badge(sub && sub.status)}</div>
                <div><div class="k">Plan</div>${sub ? sub.plan : "—"}</div>
                <div><div class="k">Paid until</div>${fmtDate(sub && sub.paid_until)}</div>
                <div><div class="k">Trial until</div>${fmtDate(sub && sub.trial_until)}</div>
                <div><div class="k">Payment provider</div>${(sub && sub.payment_provider) || "—"}</div>
                <div><div class="k">Обновлено</div>${fmtDate(sub && sub.updated_at)}</div>
            </div>
            <div class="actions" style="margin-top:14px;">
                <button class="btn" data-action="extend-trial">Продлить trial (+14д)</button>
                <button class="btn btn-primary" data-action="activate">Активировать / продлить</button>
                <button class="btn btn-danger" data-action="suspend">Suspend</button>
                <button class="btn" data-action="restore">Restore</button>
            </div>
            <div class="action-msg" id="actionMsg"></div>
        </div>

        <div class="card">
            <h2>Участники</h2>
            <table><thead><tr><th>Telegram ID</th><th>Роль</th><th>Статус</th><th>Email</th><th>Onboarding</th></tr></thead>
            <tbody>${membersRows}</tbody></table>
        </div>

        <div class="card">
            <h2>Usage (LLM)</h2>
            <div class="kv">
                <div><div class="k">Вызовы (7д)</div>${data.usage_7d.calls}</div>
                <div><div class="k">Токены (7д)</div>${data.usage_7d.tokens ?? "—"}</div>
                <div><div class="k">Стоимость (7д, USD)</div>${data.usage_7d.cost_usd ?? "—"}</div>
                <div><div class="k">Вызовы (30д)</div>${data.usage_30d.calls}</div>
                <div><div class="k">Токены (30д)</div>${data.usage_30d.tokens ?? "—"}</div>
                <div><div class="k">Стоимость (30д, USD)</div>${data.usage_30d.cost_usd ?? "—"}</div>
            </div>
        </div>

        <div class="card">
            <h2>Payment orders</h2>
            <table><thead><tr><th>InvId</th><th>Plan</th><th>Сумма</th><th>Provider</th><th>Статус</th><th>Создан</th><th>Оплачен</th></tr></thead>
            <tbody>${ordersRows}</tbody></table>
        </div>

        <div class="card">
            <h2>Последние технические события</h2>
            <p style="font-size:12px;color:var(--text-muted);margin-top:-4px;">
                Только служебная информация — без содержимого разговоров/вложений.
            </p>
            <table><thead><tr><th>Время</th><th>Модуль</th><th>Событие</th><th>OK</th><th>Severity</th><th>Latency, ms</th><th>Сообщение</th></tr></thead>
            <tbody>${eventsRows}</tbody></table>
        </div>
    `;

    document.querySelectorAll("[data-action]").forEach(btn => {
        btn.addEventListener("click", async () => {
            const action = btn.dataset.action;
            const labels = {
                "extend-trial": "продлить trial на 14 дней",
                "activate": "активировать/продлить подписку",
                "suspend": "приостановить (suspend) подписку",
                "restore": "восстановить (restore) подписку",
            };
            if (!window.confirm(`Подтвердите: ${labels[action]} для workspace «${w.name}»?`)) return;

            const msg = document.getElementById("actionMsg");
            msg.textContent = "Выполняется…";
            let result;
            if (action === "extend-trial") {
                result = await callAction(`/api/admin/workspaces/${workspaceId}/extend-trial`, { confirm: true, days: 14 });
            } else if (action === "activate") {
                result = await callAction(`/api/admin/workspaces/${workspaceId}/activate`, { confirm: true });
            } else if (action === "suspend") {
                result = await callAction(`/api/admin/workspaces/${workspaceId}/suspend`, { confirm: true });
            } else if (action === "restore") {
                result = await callAction(`/api/admin/workspaces/${workspaceId}/restore`, { confirm: true });
            }
            if (result && result.error) {
                msg.textContent = "Ошибка: " + result.error;
            } else {
                msg.textContent = "Готово.";
                load();
            }
        });
    });
}

async function load() {
    try {
        const response = await fetch(`/api/admin/workspaces/${workspaceId}`);
        if (response.status === 404) {
            document.body.innerHTML = "<p style='padding:40px;font-family:sans-serif;'>Not found.</p>";
            return;
        }
        const data = await response.json();
        if (data.error || !data.workspace) {
            document.getElementById("content").innerHTML = `<div class="loading">${data.error || "Не найдено."}</div>`;
            return;
        }
        renderContent(data);
    } catch (_) {
        document.getElementById("content").innerHTML = '<div class="loading">Ошибка загрузки.</div>';
    }
}

load();
</script>

</body>
</html>
